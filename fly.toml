app = "dryrun-api-CHANGE-ME"   # must be globally unique; "fly launch" can rewrite this
primary_region = "fra"          # Frankfurt

[build]

[env]
  PORT = "8080"
  DATA_FILE = "/data/data.json"

[[mounts]]
  source = "dryrun_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"    # webhook retries and timeout simulation run on timers, so never stop the machine
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
