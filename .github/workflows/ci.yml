name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Smoke tests
        run: npm test
      - name: Image check (Dockerfile COPY list, boot, key pages)
        run: npm run check:image
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Install browser test tooling
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: UI test (one retry for browser timing)
        run: npm run test:ui || npm run test:ui
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
