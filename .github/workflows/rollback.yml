name: Rollback
# One-click rollback: Actions > Rollback > Run workflow. Leave "image" empty to see recent images in the log, or paste one.
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to restore (registry.fly.io/paymentmentgateway:deployment-...). Empty = list recent releases only."
        required: false
jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Recent releases
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN_PRODUCTION }}" }
        run: flyctl releases --app paymentmentgateway --image | head -15
      - name: Restore
        if: inputs.image != ''
        env: { FLY_API_TOKEN: "${{ secrets.FLY_API_TOKEN_PRODUCTION }}" }
        run: |
          flyctl deploy --app paymentmentgateway --image "${{ inputs.image }}" --ha=false
          scripts/verify-deploy.sh https://zanboxx.com
